# BLE peripheral with Nordic UART Service
# Off while learning codes: the capture ISR polls the pin with IRQs masked.
CONFIG_BT=n
#CONFIG_BT_PERIPHERAL=y
#CONFIG_BT_DEVICE_NAME="IR-Tx"
#CONFIG_BT_MAX_CONN=1
#CONFIG_BT_NUS=y

# Larger MTU so a long IR code fits in one BLE write
#CONFIG_BT_BUF_ACL_RX_SIZE=251
#CONFIG_BT_BUF_ACL_TX_SIZE=251
#CONFIG_BT_L2CAP_TX_MTU=247

# IR carrier hardware
CONFIG_PWM=y
CONFIG_GPIO=y

# USB CDC ACM serial = console + logs + command input (no J-Link needed)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="IR-Tx"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# No logging subsystem: its thread would be another concurrent writer on
# the CDC ACM TX ring buffer. Everything goes through printk on main.
CONFIG_LOG=n
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_ASSERT=y

# Thread names for the crash log
CONFIG_THREAD_NAME=y
# Our own fatal handler (src/crashlog.c) replaces NCS's
CONFIG_RESET_ON_FATAL_ERROR=n
